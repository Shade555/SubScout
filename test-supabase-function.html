<!DOCTYPE html>
<html>
<head>
    <title>Test Supabase Function - Enhanced Debugging</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { background-color: #d4edda; border-color: #c3e6cb; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; }
        .info { background-color: #d1ecf1; border-color: #bee5eb; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 3px; overflow-x: auto; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        .loading { opacity: 0.6; }
    </style>
</head>
<body>
    <h1>🧪 Supabase Edge Function Test - Enhanced Debugging</h1>
    
    <div class="test-section info">
        <h3>📋 Test Information</h3>
        <p><strong>Function:</strong> send-notification-email</p>
        <p><strong>Project:</strong> YOUR_PROJECT_REF</p>
        <p><strong>Purpose:</strong> Test email notifications with detailed error reporting</p>
    </div>

    <div class="test-section">
        <h3>🚀 Test Actions</h3>
        <button onclick="testFunction()" id="testBtn">Test Edge Function</button>
        <button onclick="testDirectFetch()" id="directBtn">Test Direct Fetch</button>
        <button onclick="clearResults()">Clear Results</button>
    </div>

    <div id="results"></div>

    <script>
        const supabaseUrl = 'https://YOUR_PROJECT_REF.supabase.co'
        const supabaseKey = 'YOUR_SUPABASE_ANON_KEY'
        
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey)

        function addResult(title, content, type = 'info') {
            const resultsDiv = document.getElementById('results')
            const resultDiv = document.createElement('div')
            resultDiv.className = `test-section ${type}`
            resultDiv.innerHTML = `
                <h3>${title}</h3>
                <pre>${content}</pre>
                <small>Time: ${new Date().toLocaleTimeString()}</small>
            `
            resultsDiv.appendChild(resultDiv)
            resultsDiv.scrollTop = resultsDiv.scrollHeight
        }

        function setLoading(isLoading) {
            document.getElementById('testBtn').disabled = isLoading
            document.getElementById('directBtn').disabled = isLoading
            if (isLoading) {
                document.body.classList.add('loading')
            } else {
                document.body.classList.remove('loading')
            }
        }

        async function testFunction() {
            setLoading(true)
            addResult('🔄 Starting Supabase Client Test', 'Testing via supabase.functions.invoke()...')

            try {
                console.log('=== SUPABASE CLIENT TEST START ===')
                
                const testData = {
                    to: 'test@example.com',
                    subscription: {
                        name: 'Test Netflix Subscription',
                        amount: 15.99,
                        currency: 'USD',
                        billing_cycle: 'monthly',
                        next_payment_date: '2025-01-02',
                        description: 'Premium streaming service test'
                    },
                    daysUntil: 1
                }

                console.log('Test data:', testData)
                addResult('📤 Request Data', JSON.stringify(testData, null, 2))
                
                const startTime = Date.now()
                const { data, error } = await supabase.functions.invoke('send-notification-email', {
                    body: testData
                })
                const duration = Date.now() - startTime

                console.log('Response received:', { data, error, duration })

                if (error) {
                    console.error('Supabase function error:', error)
                    addResult('❌ Supabase Function Error', JSON.stringify(error, null, 2), 'error')
                    
                    // Additional error analysis
                    if (error.name === 'FunctionsFetchError') {
                        addResult('🔍 Error Analysis', 
                            'FunctionsFetchError usually means:\n' +
                            '1. Function not deployed\n' +
                            '2. Function crashed before returning response\n' +
                            '3. Network/timeout issue\n' +
                            '4. Environment variables missing\n\n' +
                            'Check Supabase function logs for details.', 'error')
                    }
                } else {
                    console.log('Success:', data)
                    addResult('✅ Success Response', JSON.stringify(data, null, 2), 'success')
                }

                addResult('⏱️ Performance', `Request completed in ${duration}ms`)

            } catch (err) {
                console.error('Test exception:', err)
                addResult('💥 JavaScript Exception', 
                    `${err.name}: ${err.message}\n\nStack:\n${err.stack}`, 'error')
            } finally {
                setLoading(false)
            }
        }

        async function testDirectFetch() {
            setLoading(true)
            addResult('🔄 Starting Direct Fetch Test', 'Testing via direct fetch() call...')

            try {
                console.log('=== DIRECT FETCH TEST START ===')
                
                const testData = {
                    to: 'test@example.com',
                    subscription: {
                        name: 'Test Spotify Subscription',
                        amount: 9.99,
                        currency: 'USD',
                        billing_cycle: 'monthly',
                        next_payment_date: '2025-01-02',
                        description: 'Music streaming service test'
                    },
                    daysUntil: 1
                }

                const url = `${supabaseUrl}/functions/v1/send-notification-email`
                const headers = {
                    'Authorization': `Bearer ${supabaseKey}`,
                    'Content-Type': 'application/json',
                    'apikey': supabaseKey
                }

                addResult('📤 Direct Fetch Request', 
                    `URL: ${url}\n\nHeaders:\n${JSON.stringify(headers, null, 2)}\n\nBody:\n${JSON.stringify(testData, null, 2)}`)

                const startTime = Date.now()
                const response = await fetch(url, {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify(testData)
                })
                const duration = Date.now() - startTime

                addResult('📥 HTTP Response', 
                    `Status: ${response.status} ${response.statusText}\n` +
                    `Headers: ${JSON.stringify(Object.fromEntries(response.headers.entries()), null, 2)}`)

                const responseText = await response.text()
                console.log('Raw response:', responseText)

                if (response.ok) {
                    try {
                        const responseJson = JSON.parse(responseText)
                        addResult('✅ Direct Fetch Success', JSON.stringify(responseJson, null, 2), 'success')
                    } catch (parseError) {
                        addResult('⚠️ Response Parse Error', 
                            `Could not parse JSON response:\n${responseText}`, 'error')
                    }
                } else {
                    addResult('❌ HTTP Error Response', 
                        `Status: ${response.status}\nResponse: ${responseText}`, 'error')
                }

                addResult('⏱️ Performance', `Direct fetch completed in ${duration}ms`)

            } catch (err) {
                console.error('Direct fetch exception:', err)
                addResult('💥 Fetch Exception', 
                    `${err.name}: ${err.message}\n\nStack:\n${err.stack}`, 'error')
            } finally {
                setLoading(false)
            }
        }

        function clearResults() {
            document.getElementById('results').innerHTML = ''
        }

        // Auto-scroll to bottom when new results are added
        const observer = new MutationObserver(() => {
            const results = document.getElementById('results')
            results.scrollTop = results.scrollHeight
        })
        observer.observe(document.getElementById('results'), { childList: true })
    </script>
</body>
</html>
